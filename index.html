<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff0f5" />
  <title>Important Question</title>
  <style>
    :root {
      --bg1: #fff0f5;
      --bg2: #ffe4ec;
      --card: rgba(255,255,255,.92);
      --text: #2d1b24;
      --muted: #7b5d6b;
      --yes: #ef476f;
      --yes-hover: #d93e62;
      --no: #e5e7eb;
      --no-text: #2f3137;
      --border: rgba(45,27,36,.10);
      --shadow: 0 18px 60px rgba(101,45,70,.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.95), transparent 26%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      min-height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: .30;
    }

    .heart {
      position: absolute;
      font-size: clamp(18px, 3vw, 34px);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: .75; }
      90%  { opacity: .45; }
      100% { transform: translateY(-20vh) rotate(25deg); opacity: 0; }
    }

    main {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(92vw, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .card.question-mode {
      height: calc(100dvh - 40px);
      min-height: calc(100dvh - 40px);
    }

    h1 {
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.06;
      margin: 0 0 12px;
      letter-spacing: -.03em;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
    }

    .emoji {
      display: block;
      font-size: 54px;
      margin-bottom: 10px;
    }

    .actions {
      margin: 34px auto 0;
      width: min(100%, 400px);
      height: 64px;
      position: relative;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      white-space: nowrap;
    }

    #yesBtn {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      min-width: 132px;
      min-height: 56px;
      background: var(--yes);
      color: white;
      padding: 15px 28px;
      font-size: 20px;
      box-shadow: 0 10px 24px rgba(239,71,111,.28);
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
      z-index: 3;
    }

    #yesBtn:hover {
      background: var(--yes-hover);
      transform: translateX(-50%) translateY(-2px) scale(1.02);
    }

    #yesBtn:active {
      transform: translateX(-50%) scale(.98);
    }

    #noBtn {
      position: fixed;
      left: 50%;
      top: 70%;
      transform: translate(-50%, -50%);
      width: 150px;
      min-height: 58px;
      padding: 17px 34px;
      background: var(--no);
      color: var(--no-text);
      border: 1px solid rgba(45,27,36,.10);
      box-shadow: 0 9px 20px rgba(45,27,36,.12);
      font-size: 20px;
      line-height: 1.2;
      touch-action: none;
      transition: left .14s ease-out, top .14s ease-out, transform .14s ease-out;
      will-change: left, top, transform;
      z-index: 5;
    }

    .screen[hidden],
    #noBtn[hidden] { display: none !important; }

    .form-wrap {
      margin-top: 26px;
      width: 100%;
      min-width: 0;
      display: grid;
      gap: 14px;
      text-align: left;
    }

    label {
      font-weight: 800;
      font-size: 14px;
      padding-left: 4px;
    }

    input[type="datetime-local"],
    input[type="text"] {
      display: block;
      width: 100%;
      min-width: 0;
      max-width: 100%;
      border: 1px solid rgba(45,27,36,.16);
      background: white;
      color: var(--text);
      border-radius: 16px;
      padding: 16px;
      font: inherit;
      font-size: 16px;
      outline: none;
    }

    input[type="datetime-local"] {
      overflow: hidden;
    }

    input[type="datetime-local"]::-webkit-date-and-time-value {
      min-width: 0;
      text-align: left;
    }

    input[type="datetime-local"]:focus,
    input[type="text"]:focus {
      border-color: rgba(239,71,111,.65);
      box-shadow: 0 0 0 4px rgba(239,71,111,.10);
    }

    .submit {
      margin-top: 5px;
      width: 100%;
      padding: 16px 22px;
      background: var(--yes);
      color: white;
      font-size: 17px;
    }

    .submit:hover { background: var(--yes-hover); }

    .small {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .confirmation {
      margin-top: 24px;
      border-radius: 20px;
      padding: 20px;
      background: rgba(239,71,111,.08);
      border: 1px solid rgba(239,71,111,.15);
    }

    .confirmation strong {
      display: block;
      margin-top: 7px;
      font-size: clamp(19px, 4vw, 24px);
      color: var(--text);
    }

    .secondary {
      margin-top: 18px;
      padding: 12px 20px;
      color: var(--muted);
      background: transparent;
      border: 1px solid rgba(45,27,36,.12);
    }

    .status {
      min-height: 20px;
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 520px) {
      main {
        align-items: start;
        padding: 18px 20px;
      }

      .card {
        width: min(92vw, 560px);
        padding: 32px 22px;
        border-radius: 24px;
      }

      .card.question-mode {
        height: calc(100dvh - 36px);
        min-height: calc(100dvh - 36px);
      }

      .actions { width: 100%; height: 64px; }
      #yesBtn { width: min(220px, 74%); }

      .form-wrap {
        width: 100%;
        min-width: 0;
        overflow: hidden;
      }

      input[type="datetime-local"],
      input[type="text"] {
        width: 100%;
        min-width: 0;
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true" id="hearts"></div>

  <main>
    <section class="card question-mode" id="mainCard">
      <div id="questionScreen" class="screen">
        <span class="emoji">💌</span>
        <h1>Will you go on a date with me?</h1>
        <div class="actions" id="actions">
          <button id="yesBtn" type="button">Yes ❤️</button>
        </div>
      </div>

      <div id="scheduleScreen" class="screen" hidden>
        <span class="emoji">🥳</span>
        <h1>Excellent choice.</h1>
        <form id="dateForm" class="form-wrap">
          <label for="dateTime">When are you free? I’ll treat this as the pickup time</label>
          <input id="dateTime" name="dateTime" type="datetime-local" required />

          <label for="favoriteFood">Favorite restaurant or favorite type of food?</label>
          <input
            id="favoriteFood"
            name="favoriteFood"
            type="text"
            placeholder="Sushi, Italian, your favorite restaurant..."
            autocomplete="off"
            required
          />

          <button class="submit" type="submit">Lock it in 💘</button>
          <div id="sendStatus" class="status" aria-live="polite"></div>
        </form>
      </div>

      <div id="confirmationScreen" class="screen" hidden>
        <span class="emoji">📅</span>
        <h1>It's a date.</h1>
        <p>You picked:</p>
        <div class="confirmation">
          <span>Pickup time</span>
          <strong id="chosenDate"></strong>
        </div>
        <div class="confirmation">
          <span>Favorite restaurant / food</span>
          <strong id="chosenFood"></strong>
        </div>
        <p class="small">Screenshot this so there can be no claims of “I forgot.” 😌</p>
        <button id="changeBtn" class="secondary" type="button">Change the time</button>
      </div>
    </section>
  </main>

  <button id="noBtn" type="button" aria-label="No">No</button>

  <script>
    // Optional: paste a Formspree endpoint here later to receive selections by email.
    const FORM_ENDPOINT = "";

    const mainCard = document.getElementById("mainCard");
    const questionScreen = document.getElementById("questionScreen");
    const scheduleScreen = document.getElementById("scheduleScreen");
    const confirmationScreen = document.getElementById("confirmationScreen");
    const actions = document.getElementById("actions");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const dateForm = document.getElementById("dateForm");
    const dateTime = document.getElementById("dateTime");
    const favoriteFood = document.getElementById("favoriteFood");
    const chosenDate = document.getElementById("chosenDate");
    const chosenFood = document.getElementById("chosenFood");
    const changeBtn = document.getElementById("changeBtn");
    const sendStatus = document.getElementById("sendStatus");

    let lastNoMove = 0;
    let noHasMoved = false;
    let lastCorner = -1;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function setMinimumDateTime() {
      const now = new Date();
      now.setSeconds(0, 0);
      now.setMinutes(now.getMinutes() + 1);
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 16);
      dateTime.min = local;
    }

    function getVisibleViewport() {
      const vv = window.visualViewport;
      if (vv) {
        return {
          left: vv.offsetLeft,
          top: vv.offsetTop,
          width: vv.width,
          height: vv.height,
          right: vv.offsetLeft + vv.width,
          bottom: vv.offsetTop + vv.height
        };
      }

      return {
        left: 0,
        top: 0,
        width: document.documentElement.clientWidth,
        height: document.documentElement.clientHeight,
        right: document.documentElement.clientWidth,
        bottom: document.documentElement.clientHeight
      };
    }

    function pointToRectDistance(x, y, rect) {
      const nearestX = clamp(x, rect.left, rect.right);
      const nearestY = clamp(y, rect.top, rect.bottom);
      return Math.hypot(x - nearestX, y - nearestY);
    }

    function getNoGeometry() {
      const viewport = getVisibleViewport();
      const btnRect = noBtn.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      const cardRect = document.querySelector(".card").getBoundingClientRect();

      const edgeMargin = 18;
      const verticalGap = 18;

      // The No-button chase rectangle now lives visually INSIDE the white card.
      // The button itself remains outside the card in the DOM so mobile browsers
      // cannot mis-handle position:fixed because of backdrop-filter.
      const topY = clamp(
        yesRect.bottom + verticalGap,
        cardRect.top + edgeMargin,
        cardRect.bottom - btnRect.height - edgeMargin
      );

      const bottomY = Math.max(
        topY,
        cardRect.bottom - btnRect.height - edgeMargin
      );

      const leftX = cardRect.left + edgeMargin;
      const rightX = Math.max(
        leftX,
        cardRect.right - btnRect.width - edgeMargin
      );

      return {
        viewport,
        cardRect,
        btnRect,
        yesRect,
        topY,
        bottomY,
        leftX,
        rightX
      };
    }

    function setNoPosition(left, top, rotate = false) {
      noBtn.style.left = `${left}px`;
      noBtn.style.top = `${top}px`;
      noBtn.style.transform = rotate
        ? `rotate(${(Math.random() * 2 - 1).toFixed(1)}deg)`
        : "none";
    }

    function positionNoAtStart() {
      if (questionScreen.hidden || noHasMoved) return;

      noBtn.hidden = false;

      // Wait until the browser has laid out the button and Yes button.
      const { cardRect, btnRect, yesRect } = getNoGeometry();

      const left = cardRect.left + (cardRect.width - btnRect.width) / 2;

      // Reduce the current initial Yes-to-No gap by another 40%.
      // Previous setting was 60% of the baseline; this is now 36%
      // of that original baseline gap (60% of the current gap).
      const oldTop = yesRect.bottom
        + (cardRect.bottom - yesRect.bottom) / 2
        - btnRect.height / 2;
      const oldGap = Math.max(18, oldTop - yesRect.bottom);
      const top = clamp(
        yesRect.bottom + oldGap * 0.36,
        yesRect.bottom + 18,
        cardRect.bottom - btnRect.height - 18
      );

      setNoPosition(left, top, false);
    }

    function moveNoButton(force = false) {
      if (questionScreen.hidden) return;

      const now = performance.now();
      if (!force && now - lastNoMove < 35) return;
      lastNoMove = now;
      noHasMoved = true;

      const { topY, bottomY, leftX, rightX } = getNoGeometry();

      const corners = [
        { left: leftX,  top: topY },     // top-left
        { left: rightX, top: topY },     // top-right
        { left: leftX,  top: bottomY },  // bottom-left
        { left: rightX, top: bottomY }   // bottom-right
      ];

      // Determine which corner the button is ACTUALLY closest to right now.
      // This prevents a random choice from ever selecting its current location.
      const currentRect = noBtn.getBoundingClientRect();
      let currentCorner = -1;
      let closestDistance = Infinity;

      corners.forEach((corner, index) => {
        const distance = Math.hypot(
          currentRect.left - corner.left,
          currentRect.top - corner.top
        );
        if (distance < closestDistance) {
          closestDistance = distance;
          currentCorner = index;
        }
      });

      // Only treat it as occupying a corner when it is actually near one.
      if (closestDistance > 40) currentCorner = -1;

      const availableCorners = corners
        .map((corner, index) => ({ corner, index }))
        .filter(({ index }) => index !== currentCorner && index !== lastCorner);

      // If lastCorner and currentCorner happen to exclude too much,
      // fall back to every corner except the one it is physically on.
      const choices = availableCorners.length
        ? availableCorners
        : corners
            .map((corner, index) => ({ corner, index }))
            .filter(({ index }) => index !== currentCorner);

      const choice = choices[Math.floor(Math.random() * choices.length)];
      lastCorner = choice.index;
      setNoPosition(choice.corner.left, choice.corner.top, true);
    }

    // Desktop: flee as soon as the pointer reaches the edge.
    document.addEventListener("pointermove", (event) => {
      if (questionScreen.hidden || event.pointerType !== "mouse") return;

      const rect = noBtn.getBoundingClientRect();
      if (pointToRectDistance(event.clientX, event.clientY, rect) <= 12) {
        moveNoButton();
      }
    }, { capture: true, passive: true });

    // Mobile/tablet: use ONE primary event path.
    // Listen on the document in capture phase so Chrome/iOS cannot miss the
    // interaction because of hit-testing during/after a button transition.
    function pointInsideExpandedRect(x, y, rect, padding = 16) {
      return (
        x >= rect.left - padding &&
        x <= rect.right + padding &&
        y >= rect.top - padding &&
        y <= rect.bottom + padding
      );
    }

    function handleMobilePress(clientX, clientY, event) {
      if (questionScreen.hidden) return;

      const rect = noBtn.getBoundingClientRect();
      if (!pointInsideExpandedRect(clientX, clientY, rect, 18)) return;

      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();

      moveNoButton(true);
    }

    if (window.PointerEvent) {
      document.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "touch" && event.pointerType !== "pen") return;
        handleMobilePress(event.clientX, event.clientY, event);
      }, { capture: true, passive: false });
    } else {
      document.addEventListener("touchstart", (event) => {
        if (!event.touches || !event.touches.length) return;
        const touch = event.touches[0];
        handleMobilePress(touch.clientX, touch.clientY, event);
      }, { capture: true, passive: false });
    }

    noBtn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
      return false;
    }, { capture: true });

    noBtn.addEventListener("contextmenu", (event) => event.preventDefault());

    function refreshNoPosition() {
      if (!noHasMoved && !questionScreen.hidden) {
        requestAnimationFrame(positionNoAtStart);
      }
    }

    window.addEventListener("resize", refreshNoPosition);
    window.addEventListener("orientationchange", refreshNoPosition);
    window.addEventListener("pageshow", refreshNoPosition);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refreshNoPosition);
      window.visualViewport.addEventListener("scroll", refreshNoPosition);
    }

    requestAnimationFrame(() => {
      requestAnimationFrame(positionNoAtStart);
    });

    yesBtn.addEventListener("click", () => {
      mainCard.classList.remove("question-mode");
      questionScreen.hidden = true;
      noBtn.hidden = true;
      scheduleScreen.hidden = false;
      confirmationScreen.hidden = true;
      setMinimumDateTime();
    });

    changeBtn.addEventListener("click", () => {
      confirmationScreen.hidden = true;
      scheduleScreen.hidden = false;
      sendStatus.textContent = "";
      setMinimumDateTime();
    });

    dateForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!dateTime.value || !favoriteFood.value.trim()) return;

      const selected = new Date(dateTime.value);
      if (Number.isNaN(selected.getTime()) || selected <= new Date()) {
        sendStatus.textContent = "Pick a time in the future 🙂";
        return;
      }

      const formatted = selected.toLocaleString(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });

      chosenDate.textContent = formatted;
      chosenFood.textContent = favoriteFood.value.trim();
      scheduleScreen.hidden = true;
      confirmationScreen.hidden = false;

      if (!FORM_ENDPOINT) return;

      try {
        await fetch(FORM_ENDPOINT, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            selected_date_time: formatted,
            selected_date_time_raw: dateTime.value,
            favorite_restaurant_or_food: favoriteFood.value.trim(),
            _subject: "A date was selected ❤️"
          })
        });
      } catch (error) {
        console.error(error);
      }
    });

    const hearts = document.getElementById("hearts");
    const symbols = ["❤", "♡", "💕"];
    for (let i = 0; i < 14; i++) {
      const el = document.createElement("span");
      el.className = "heart";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = (9 + Math.random() * 10) + "s";
      el.style.animationDelay = (-Math.random() * 18) + "s";
      hearts.appendChild(el);
    }

    setMinimumDateTime();
  </script>
</body>
</html>
